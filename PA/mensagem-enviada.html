<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="css/mensagem-enviada.css"
    >

    <title>Mensagem enviada - Bencom</title>
</head>

<body>

    <div class="confirmacao-box">

        <div class="icone">
            ✓
        </div>

        <h1>Mensagem enviada!</h1>

        <p>
            Sua mensagem foi enviada com sucesso para a direção da escola.
        </p>

        <div class="resumo">

            <strong>Assunto:</strong>

            <p>
                {{ assunto }}
            </p>

        </div>

        <p class="aviso">
            Aguarde o retorno da escola.
        </p>

        <a
            class="btn-voltar"
            href="/"
        >
            Voltar ao início
        </a>

    </div>

</body>

</html>
