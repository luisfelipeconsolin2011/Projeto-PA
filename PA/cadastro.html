<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/cadastro.css">

    <title>Cadastro - Bencom</title>

</head>

<body>

    <div class="caixa-cadastro">

        <a href="/">
            <img class="logo"
                 src="/img/Bencon.png"
                 alt="Logo Bencom">
        </a>

        <h1>Crie sua conta</h1>

        <p class="subtitulo">
            Aproxime-se da sua escola.
        </p>

        <form action="/cadastrar" method="POST">

            <label for="nome">Nome completo</label>

            <input type="text"
                   id="nome"
                   name="nome"
                   placeholder="Digite seu nome completo"
                   required>


            <label for="email">E-mail</label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Digite seu e-mail"
                   required>


            <label for="usuario">Nome de usuário</label>

            <input type="text"
                   id="usuario"
                   name="usuario"
                   placeholder="Escolha um usuário"
                   required>


            <label for="senha">Senha</label>

            <input type="password"
                   id="senha"
                   name="senha"
                   placeholder="Crie uma senha"
                   minlength="8"
                   required>


            <label for="confirmar-senha">
                Confirme sua senha
            </label>

            <input type="password"
                   id="confirmar-senha"
                   name="confirmar_senha"
                   placeholder="Digite novamente sua senha"
                   required>


            {% if erro %}

                <p class="erro">{{ erro }}</p>

            {% endif %}


            <button type="submit" class="btn-cadastrar">
                Criar conta
            </button>

        </form>


        <p class="link-login">

            Já possui uma conta?

            <a href="/login.html">Faça login</a>

        </p>

        <a class="voltar" href="/">
            Voltar ao início
        </a>

    </div>

</body>

</html>
